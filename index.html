<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Valentine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Press Start 2P', cursive;
        background-color: #fce7f3; /* pink-100 */
        /* Retro grid background pattern */
        background-image: 
          linear-gradient(#fbcfe8 1px, transparent 1px),
          linear-gradient(90deg, #fbcfe8 1px, transparent 1px);
        background-size: 20px 20px;
      }
      
      /* Pixel Art Utilities */
      .pixel-shadow {
        box-shadow: 4px 4px 0px 0px rgba(0,0,0,1);
      }
      .pixel-shadow-sm {
        box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
      }
      .pixel-border {
        border-width: 4px;
        border-style: solid;
        border-color: black;
      }
      
      /* Animations */
      @keyframes float {
        0% { transform: translateY(0px); opacity: 1; }
        100% { transform: translateY(-40px); opacity: 0; }
      }
      .animate-float {
        animation: float 1s ease-out forwards;
      }
      
      @keyframes bounce-pixel {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .animate-bounce-pixel {
        animation: bounce-pixel 0.5s steps(2) infinite;
      }

      @keyframes pop-in {
        0% { transform: scale(0); opacity: 0; }
        80% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .pop-in {
        animation: pop-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
    </style>

  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
