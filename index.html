<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Valentine</title>

    <!-- Tailwind via CDN so your existing classes work -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: 'Press Start 2P', cursive;
        background-color: #fce7f3; /* pink-100 */
        background-image:
          linear-gradient(#fbcfe8 1px, transparent 1px),
          linear-gradient(90deg, #fbcfe8 1px, transparent 1px);
        background-size: 20px 20px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite will use this as the entry and mount your React app from index.tsx -->
